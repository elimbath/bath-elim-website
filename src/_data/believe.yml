intro: The clearest way to speak about what we believe can be found in what is known as Elim's foundational truths
beliefs:
  - icon: /images/32195a_1d2207860e8d4689a06c2078f7935afa.png
    title: THE BIBLE
    text: We believe the Bible, as originally given, to be without error, the fully inspired and infallible Word of God and the supreme and final authority in all matters of faith and conduct.
  - icon: /images/32195a_823abebd49ea47bda67b4af4fee12e00.png
    title: THE TRINITY
    text: We believe that the Godhead exists co-equally and co-eternally in three persons – Father, Son and Holy Spirit – and that these three are one God, sovereign in creation, providence and redemption.
  - icon: /images/32195a_004ec9c2f3814a7faf801fa080e02719.png
    title: THE SAVIOUR
    text: We believe in the true and proper deity of our Lord Jesus Christ, in His virgin birth, in His real and complete humanity, in His sinless life, in His authoritative teaching, in His substitutionary and atoning sacrifice through His blood shed, in His bodily resurrection, in His ascension to the right hand of the Father, in His heavenly intercession and His second advent to receive His Church.
  - icon: /images/32195a_8be4936d73bf4cea9d6da9504eeae0f2.png
    title: THE HOLY SPIRIT
    text: We believe in the deity of the Holy Spirit who proceeds from the Father and the Son and the necessity of His work in conviction of sin, repentance, regeneration and sanctification, and that the believer is also promised an enduement of power as the gift of Christ through the baptism in the Holy Spirit with signs following. Through this enduement, the believer is empowered for fuller participation in the ministry of the Church, its worship, evangelism and service.
  - icon: /images/32195a_4237cfa708da41fbafbffc7a203cda03.png
    title: HUMANITY
    text: We believe in the inherent dignity and value of every person, as created in God’s image and likeness, male and female, to be in fellowship with God and serve God’s purposes in creation. Yet on account of the universal sinfulness of all people due to the Fall, humanity is subject to God’s righteous wrath and condemnation.
  - icon: /images/32195a_87d3c2c071e244dab30d8bd82228cd3f.png
    title: SALVATION
    text: We believe in the necessity for salvation of repentance towards God and faith in the Lord Jesus Christ by which the sinner is pardoned and accepted as righteous in God’s sight. This justification is imputed by the grace of God because of the atoning work of Christ, is received by faith alone and is evidenced by the Fruit of the Spirit and a holy life.
  - icon: /images/32195a_1f2e8fe0acf744f48471498cbaf1b3a0.png
    title: THE CHURCH
    text: We believe in the spiritual unity and the priesthood of all believers in Christ and that these comprise the universal Church, the Body of Christ.
  - icon: /images/32195a_2b4910a621a14fd683b954a27bc77b01.png
    title: THE MINISTRY
    text: We believe in the ministries that Christ has set in His Church, namely, apostles, prophets, evangelists, pastors and teachers and in the present operation of the manifold Gifts of the Holy Spirit according to the New Testament.
  - icon: /images/32195a_5a86f78616404536a68d54c20deeaf0d.png
    title: THE ORDINANCES
    text: We believe in the baptism of believers in water in obedience to the command of Christ and the commemoration of Christ’s death by the observance of the Lord’s Supper until His return.
  - icon: /images/32195a_30414043a4ac480c8a19508d0cb8ff2e.png
    title: THE COMMISSION
    text: We believe that the Gospel embraces the needs of the whole man and that the Church is therefore commissioned to preach the Gospel to the world and to fulfil a ministry of healing and deliverance to the spiritual and physical needs of mankind.
  - icon: /images/32195a_0738a177796746b59ec55d029bc98fb6.png
    title: THE COMING KING
    text: We believe in the personal, physical and visible return of the Lord Jesus Christ to reign in power and glory.
  - icon: /images/32195a_0ff0bd6512f940e4b75a601fefb105eb.png
    title: THE FUTURE STATE
    text: We believe in the resurrection of the dead and in the final judgement of the world, the eternal conscious bliss of the righteous and the eternal conscious punishment of the wicked.
