title: Precious Ladies
hero: /images/32195a_afa0d9839b6f4a0884a581b1e518e978.jpg
lead: Precious ladies is about friendship and a place where we can committing to one another and to help each woman grow in spirit, soul and body.
ways_heading: We do this in three ways...
ways:
  - title: WhatsApp Group
    text: We have a very active WhatsApp group where a bible verse along with a short devotion is posted daily and comments encouraged.
  - title: Masterclass
    text: This is an opportunity for one of the ladies to teach us a skill.  Whether it be baking, crochet, keep fit or whatever, these quarterly events are a great chance to let our hair down!
  - title: Pastoral Care
    text: We are committed to having each others back!  Being a woman is challenging, but being a woman of God is the most precious thing.  We are called to encourage one another and to build one another up in love.
