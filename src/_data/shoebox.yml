text: |-
  The mission of Operation Christmas Child is to demonstrate God's love in a tangible way to children in need around the world. They do this by collecting and sending shoeboxes filled with gifts to children in over 170 countries. We are delighted to be taking part in this amazing work and act as the collection centre for Bath.

  If you are in the area and would like to volunteer some time to help, or you would just like to find out more, please fill in the contact form below.
