gift_aid: |-
  We are able to reclaim the tax back from your donation if you are a UK taxpayer.  This can increase your giving by 25% without any extra cost to you.

  Whether giving as a one-off or a regular amount, a simple Gift Aid Declaration form will need to be completed.

  Please email [dawn@elimbath.org](mailto:dawn@elimbath.org)
