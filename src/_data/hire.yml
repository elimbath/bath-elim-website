title: Your Next Event Space?
intro: |-
  **Bath Elim Church** is a beautiful grade II* listed building of both historical and architectural interest.  Being situated in Bath city centre and located directly across from Charlotte Street car park, this unique venue boasts many practical incentives too.  Please don't hesitate to contact us to talk through any of your requirements or to find out further information.

  We have 3 rooms available to hire and there is high speed internet access (WiFi) throughout the building.
rooms:
  - name: Auditorium
    photos:
      - image: /images/32195a_dde24c470604495f86bf358c9d97c3f3.jpg
      - image: /images/32195a_50fa5c00259c48038f5dae0b041dadad.jpg
      - image: /images/32195a_a353168d7ed64f0894807366e048e6ef.jpg
    text: |-
      This space is the beautiful centrepiece of the building. The moment you walk through the door, your eyes will be drawn up to the breathtaking 10-sided ceiling surrounded in beautiful stained-glass windows.

      It is also the perfect blend of beauty and functionality, offering a memorable atmosphere for all kinds of events.

      So whether you are planning a concert, conference or ceremony, this space is sure to leave a lasting impression.

      In total we can seat 130 people and is available to hire in full, half-day or evening periods.
  - name: Cleveland Room
    photos:
      - image: /images/32195a_42add0d2dfb7418580ba17c3def64323.jpg
      - image: /images/32195a_fd9d5f4d5be14b1d8853f9b581461928.jpg
      - image: /images/32195a_89bc63872d7f4437854f71b2ccfb8ff6.jpg
    text: |-
      This is versatile and welcoming, thoughtfully designed to suit a wide range of events. Its open-plan layout makes it perfect for customisation, allowing you to create the ideal atmosphere for your gathering.

      Conveniently located adjacent to our fully fitted commercial kitchen, this room offers seamless functionality for events that require catering or refreshments.

      With seating arrangements for up to 80 people in rows, or the option to set it up in a café style or any layout of your choice, the Cleveland Room is as adaptable as it is inviting.
  - name: Commercial Kitchen
    photos:
      - image: /images/32195a_a74fa1e962654adcb1808fda5cf08239.jpg
      - image: /images/32195a_23cef533242a4203bbcd4fba1fa4b53e.jpg
      - image: /images/32195a_4bbffe097b3f48e19847c99b34312ac3.jpg
    text: |-
      Leading from the Cleveland Room, our Kitchen is capable of handling catering needs with ease.

      Featuring a double turbofan oven, 4 induction hotplates, 2 electrically heated serveries, ecomax plus dishwasher (40 racks an hour), designated counter space and sinks.

      This kitchen has also been registered with the council so it can operate as a separate business or dark kitchen.
  - name: Dolemeads Room
    photos:
      - image: /images/32195a_59696d7cd0bc4841872a778b78d82683.jpg
    text: |-
      This is an intimate and bright space, perfect for smaller gatherings, meetings, or workshops. Its cozy atmosphere creates a focused and welcoming environment for your group.

      With seating for up to 15 people, this room is ideal for more personal or collaborative sessions. The addition of a whiteboard makes it especially suited for presentations, brainstorming, or planning activities.
