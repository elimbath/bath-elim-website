title: Terms of building hire
body: |-
  ## Hire Agreement

  The Church is acting on behalf of the Elim Trust Corporation (ETC) and the Hirer will be the person/s or company hiring the facilities.

  1. The Church agrees to make available the room(s) and facilities / equipment on the dates stated for the charge which will be agreed in writing, subject to the terms of this Agreement. This Agreement is personal to the Hirer and may not be assigned, transferred, sub-licensed or sub-let.

  ### Payment & Cancellation

  2. On confirmation and by signing this agreement, the hirer shall pay the agreed non-refundable Booking Deposit (25% of the booking fee), along with all applicable Hire Fees which must be paid no later than 14 days in advance of the event. The Booking Deposit and any applicable hire fees made, will be refunded if the event is cancelled by the Church, unless this results from any act or omission of the Hirer that entitles The Church to terminate this agreement.

  3. In the event of a cancellation of a confirmed booking, the following refunds will apply:  
  a. More than 2 months before the event: Deposit refund less 25%  
  b. Less than 2 months before the event: No deposit refund due

  4. All payments due from the Hirer under this agreement are to be made by 14 days prior to the event. Failure to comply with this will result in the event being cancelled and the booking deposit forfeited.

  5. If the Church supplies additional requested services, facilities or equipment, not specified above, or if the Hirer arrives sooner than any start time or vacates later than any finish time set out above, the Hirer will pay for these at the prevailing standard rates applicable prior to the start date, or if applicable within 7 days of supply, whether an invoice has been raised.

  6. The Hirer agrees to comply with attached terms and conditions for the hire and from time to time and with all directions which the Church or an officer of any public or statutory authority may give in relation to the Hirer’s management of the Event or the preparations for it.

  7. ETC shall not be liable to the Hirer in any way if the event cannot take place or is interrupted for any reason beyond its reasonable control nor, in any circumstances, for the failure before or during the event of any plant, systems or equipment installed in or belonging to the Church or Hirer, or any force majeure that occurs which impacts the ability to deliver the events.

  8. The Hirer shall indemnify the Church fully from and against all losses, damages, expenses, costs, claims and demands which the Church may incur or for which it may become liable as a result of anything completed or omitted to be done by the Hirer, its officers, staff, contractors, members, customers, guests and/or invitees.

  9. The Hirer shall not under any circumstance engage in or allow fly posting for the Event unless specific written consent has been obtained from the Church. Breach of this condition will result in forfeit of your deposit.

  10. An Invoice will be provided to the Hirer outlining aspects of the agreement, rates, deposit required and payment dates.

  ## Terms & Conditions of Hire

  ### Management of the Event

  1. The Hirer must ensure that neither the Hirer nor any person attending their Event obstructs, impedes or causes a nuisance, disturbance or annoyance to any other people using other parts of the building concurrently with the Hirer.

  2. The facilities hired may be used only for the purpose specified in the Agreement. If used by the Hirer or anyone else for any other purpose, the Agreement will be terminated forthwith and the Event and any other use will be brought to an end immediately.

  3.The Hirer is responsible for compliance with all Health & Safety, Food Hygiene, Fire Safety, PAT certificate, Insurance, Children and Young Persons Act 2008 and Safeguarding regulations applicable and necessary to ensure a safe event is managed and maintained.

  4. The Hirer shall notify the Church forthwith of any accident occurring on the premises in connection with the Event and an accurate account made in the Accident Book.

  5. The Hirer is responsible for acquainting itself with the Evacuation Procedure and ensuring, in case of a fire, that the area of the building hired is evacuated in a safe and orderly manner.

  6. The Hirer must ensure that all emergency exits remain unlocked and unobstructed throughout the period of hire.

  7. The Hirer must supervise the use of the premises covered by the hire agreement during the times of hire. This includes ensuring compliance with the building's policies (including its no- smoking, no Alcohol and no illegal substance use). The Hirer shall provide sufficient stewards/helpers (who must be identifiable as such) for the Event as is deemed necessary to ensure compliance with the Hirer’s obligations under this Agreement.

  8. The Hirer must not permit any person who has been excluded from the building to attend the Event.

  ### Public Liability Insurance

  9. You are requested to ensure your event is covered by Insurance appliable for the hire period and a copy provided to the Church.

  10. Any property brought upon the premises by the Hirer or any attendees at the Event is entirely at the Hirer’s own risk. The Church has no insurance cover for third party property in the event of loss and/or damage.

  ### Portable Appliance Testing – PAT

  11. If the Hirer wishes to use its own electrical equipment, this equipment must comply with current electrical safety standards and an up-to-date PAT Certificate must be supplied prior to the start of the event.

  ### Access  
  (Key Holder)

  12. Where a Church Key Holder is not present during the whole event and Keys/access arranged with the Hirer, any loss of keys will result in a charge of £50 per key.

  13. The Hirer shall comply with Elim Gospel Alliance beliefs and shall not in any way support something that offends or contradicts this belief.

  14. The Hirer shall not in any way state or imply that the Church is associated with or supportive of the Hirer and or event without the prior written permission of the Church.

  15. The Hirer shall not permit anything to be said or done in or about the premises which is subversive of public law or order or which may lead to a breach of the peace or which may injure the reputation of the building.

  16. The Hirer shall comply with all statutes regulations and bye-laws applicable to the event and shall not permit anything which could become a public nuisance or cause nuisance, annoyance or damage to any person or property.

  ### Licenses

  17. Alcoholic drinks are not permitted, unless prior arrangement with the Church has been sought.

  18. No broadcast or recording of the event or any part of it for the purpose of television, radio or publication or reproduction in any medium shall be made without the prior written permission of the Church.

  19. No collection, game of chance, sweepstake, gambling or lottery shall take place on the premises.

  20. The Church hold PPL and PRS Licenses, but it is the Hirer’s responsibility to ensure up-to-date licences are held and supplied to the Church.

  ### General

  The Hirer shall not:

  21. Allow Alcohol to be brought onto the premises, unless previously agreed with the Church.

  22. Allow Smoking/Vaping to take place in or on the Church premises.

  23. Allow open fires to be lit.

  24. Deface any part of the building.

  25. Drive any nail, screw, hook fitment or other fixing means to the fabric of the internal and external structure of the Church building.

  26. Adjust or interfere with the heating, cooling, lighting or power supply facilities at the venue without prior written consent from the Church.

  27. Bring any furniture, equipment, animal, live flame or any unsuitable object onto the premises.

  28. Allow Hazardous substance onto the premises.

  29. The organiser of the event must be in attendance at all times or notify the Church when they are absent and nominate a responsible Adult to manage the event in their absence.

  30. Not allow anyone under the age of 18 years to be left in charge.

  31. Allow Children to be left unattended.

  32. Where children are invited to attend and Adult supervision is required, it is the Hirer’s responsibility to ensure suitably qualified person/s are present at all times and hold the appropriate and valid DBS or Advanced DBS check, a copy of which should be supplied to the Church.

  ### Other

  33. The Hirer shall ensure a fully qualified First Aider is in attendance at all times and be aware of the positions of where the First Aid and Accident Book are kept.

  34. The Hirer must take reasonable care of the premises and property and pay for any damage.

  35. The Hirer must ensure that all attendee at the Event are invited to attend and control exercised over unruly or unacceptable behaviour.

  36. The Hirer must pay for any additional cleaning or breakages sustained during the event.

  37. Nothing in this Agreement gives any rights to or confers any benefits upon any person who is not a party to it.

  38. The Church reserves the right to cancel any letting for non-compliance with these terms and/or to take whatever steps it sees fit to ensure the proper management of the Event if the Hirer fails or refuses to do so.

  39. Either party may terminate this agreement with 90 days written notice. In the event that 90 days written notice is not provided the Church retains the right to seek financial compensation for any shortfall in the notice period equal to and not exceeding the agreed rate of lost income.

  40. The Hirer will comply with all Fire Safety instructions issued and run through of evacuation of the premises.
