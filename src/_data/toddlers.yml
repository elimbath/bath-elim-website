  text: '"Little Friends is a space where friendships are formed.  I pray for God''s wisdom to build on this.'
  author: Grace Nesbitt
text: |-
  Little Friends runs on a Monday morning between 10am – 12pm during term time.

  It costs £3 per family and we offer tea and coffee for grown ups, crafts, play time, snacks, music and fun fun fun for toddlers! We celebrate special occasions and have a summer outing weather permitting.

  Do come along and be a part of the fun. A warm welcome awaits.
