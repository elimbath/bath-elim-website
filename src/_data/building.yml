questions:
  - question: WHEN WAS IT BUILT?
    answer: The foundation stone was laid on March 28th 1854 with Percy Chapel officially opening on 13th December 1854.
  - question: WHO DESIGNED IT?
    answer: Percy Chapel was built to the design of H. E. and A. S. Goodridge.
  - question: WHY WAS IT BUILT?
    answer: Prior to 1854 the then congregation met in Argyle Chapel led by William Jay.  When Jay retired, half the congregation didn't think much of his replacement so they set up a new independent chapel in the city.
  - question: WHY WAS IT CALLED PERCY CHAPEL?
    answer: As a mark of respect to Rev. William Jay, the new chapel was called Percy Chapel, after his residence – Percy Place.
  - question: WHEN WAS IT BUILT?
    answer: The foundation stone was laid on March 28th 1854 with Percy Chapel officially opening on 13th December 1854.
  - question: SPECIAL DESIGN FEATURES
    answer: |-
      One of the things that you cannot help but notice when you step into the main auditorium is the gallery space of which the ten-sided lantern is the principle feature.  As far as we know is the only one of its type in the UK.  It spans over 40 feet in diameter and it is supported by ten semi-circular stone arches.

      Round the sides of the lantern are 40 windows, four in each side. There are additionally three wheel windows, nine feet in diameter, on the side and end walls.
