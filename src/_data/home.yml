welcome:
  title: Welcome
  image: /images/32195a_644574676b884324aa4a54554f28b9ab.jpg
  text: >-
    We’re a friendly, welcoming community that has been part of the heart of
    Bath for nearly 100 years. Our church includes people of all ages and
    backgrounds, and there’s a place for you here, no matter where you’re coming
    from.


    We believe in a message of hope and transformation: that Jesus Christ, who lived over 2,000 years ago, brings new life and purpose to people today. Whether you’re curious about faith, exploring life’s big questions, or just looking for a supportive community, we’re here for you.


    Bath Elim is part of the Elim Pentecostal family, and we’d love for you to join us at one of our gatherings soon. Wherever you are on your journey, you’re welcome here.
